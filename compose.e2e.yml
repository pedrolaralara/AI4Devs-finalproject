services:
  api:
    command: ["sh", "-ec", "cd apps/api && node ace migration:run && node ace db:seed && npm run dev"]
    environment:
      NODE_ENV: development
      APP_URL: http://web:5173
      APP_KEY: requesto-e2e-key-only-for-local-tests
      LOG_LEVEL: error

  web:
    ports: !reset []
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 2s
      timeout: 3s
      retries: 15

  db:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data

  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    init: true
    ipc: host
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    environment:
      REQUESTO_E2E_URL: http://web:5173
    depends_on:
      web:
        condition: service_healthy
    command: npm run test:e2e
